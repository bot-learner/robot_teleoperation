aimrt:
  log:
    core_lvl: INFO
    backends:
      - type: console
  plugin:
    plugins:
      - name: iceoryx_plugin
        path: /opt/agibot/bin/libaimrt_iceoryx_plugin.so
  channel:
    backends:
      - type: iceoryx
    pub_topics_options:
      - topic_name: "/body_drive/arm_joint_command"
        enable_backends: [iceoryx]
      - topic_name: "/teleop/dry_run/arm_joint_command"
        enable_backends: [iceoryx]
    sub_topics_options:
      - topic_name: "/body_drive/arm_joint_state"
        enable_backends: [iceoryx]
      - topic_name: "/teleop/dry_run/arm_joint_command"
        enable_backends: [iceoryx]
  module:
    pkgs:
      - path: ${A3_MDU_BRIDGE_LIBRARY}
    modules:
      - name: A3MduArmBridge
        log_lvl: INFO
